# 【已停用】云端定时方案 —— 2026-10-24 判定失败，已迁移到本机 Windows 计划任务
#
# 结论：GitHub Actions 的 schedule 在本账号上完全不投递。两天内 0 条 schedule 事件，
#       期间跨越了多个配置正确的纯 UTC cron 边界，并排除过 timezone 字段、cron 写法、
#       仓库本身、提交方式（git push vs API）等变量。
# 现状：本文件的定时器已摘除，仅保留 workflow_dispatch 供手动触发。
#       正式签到已改为本机计划任务：SWMS-AutoCheckin（每天 19:31 / 19:36）。
#
# 若日后要恢复云端定时，把 on: 块改回：
#   on:
#     schedule:
#       - cron: "45 11 * * *"   # 北京 19:45
#       - cron: "5 12 * * *"    # 北京 20:05
#     workflow_dispatch:
name: trigger private checkin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private repo workflow
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_PAT }}
        run: |
          set -o pipefail
          url="https://api.github.com/repos/muchuan-zt/swms-auto-checkin/actions/workflows/auto-checkin.yml/dispatches"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"master"}' \
            "$url")
          echo "dispatch HTTP $code"
          cat /tmp/resp || true
          # 204 = 触发成功；401 token 失效 / 404 分支或文件名不对 / 403 权限不足
          [ "$code" = "204" ] || {
            echo "::error::dispatch 失败，HTTP $code（204 才是成功）"
            exit 1
          }

      # keepalive 必须在 dispatch 之后且 always()，保证 dispatch 失败也会提交
      - name: Checkout for keepalive
        if: always()
        uses: actions/checkout@v4

      - name: Push keepalive commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%F)" || true
          git push || true