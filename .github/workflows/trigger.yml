name: trigger private checkin

on:
  schedule:
    - cron: "31 19 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private repo workflow
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/muchuan-zt/swms-auto-checkin/actions/workflows/auto-checkin.yml/dispatches \
            -d '{"ref":"master"}' \
            -w "\nHTTP %{http_code}\n"

      - name: Keepalive commit (prevent 60-day schedule disable)
        if: always()
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Push keepalive commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%F)" || true
          git push || true
