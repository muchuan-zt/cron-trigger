# 部署目标：muchuan-zt/cron-trigger → .github/workflows/cron-probe.yml
#
# 用途：一次性认清"这个仓库的 schedule 到底会不会被 GitHub 触发"。
# 只做一件事 —— 每 5 分钟被 schedule 唤醒就打印一行时间戳。
# 不 dispatch、不提交、不发邮件、不碰打卡程序，零副作用。
#
# 判读（push 后等约 15 分钟，看 Actions 列表里有没有 event=schedule 的运行）：
#   出现 schedule 运行 → 机制没坏，之前的 0 条就是 timezone 字段把 schedule 弄废了，
#                        改用 trigger.yml 的 UTC 写法即可收工，然后删掉本文件。
#   15 分钟仍是 0 条 → GitHub 根本没给这个仓库注册 cron，别再加时间点了，
#                        改用免费外部定时器（cron-job.org / Cloudflare Worker Cron）
#                        直接 POST dispatch 接口。

name: cron probe (temporary diagnostic)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mark probe
        run: echo "schedule probe fired at $(date -u +%FT%TZ)"
